<svg width="680" height="554" viewBox="0 0 680 554" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Amendment and notification component diagram</title>
<desc>The path from an officer submitting an amendment through the Amendment Controller, Versioning Service, Primary Database, Verification Log Query, Notification Queue Writer, to the Notification Service</desc>
<defs>
<marker id="arrow3" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="340" y1="84" x2="340" y2="110" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow3)"/>
<line x1="340" y1="166" x2="340" y2="200" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow3)"/>
<line x1="425" y1="228" x2="460" y2="228" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow3)"/>
<line x1="340" y1="256" x2="340" y2="290" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow3)"/>
<line x1="340" y1="346" x2="340" y2="380" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow3)"/>
<line x1="340" y1="436" x2="340" y2="470" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow3)"/>

<g>
<rect x="255" y="40" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="340" y="66" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Council officer</text>
</g>

<g>
<rect x="255" y="110" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="132" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Amendment controller</text>
<text x="340" y="152" text-anchor="middle" font-size="12" fill="#085041">Receives submission</text>
</g>

<g>
<rect x="255" y="200" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="222" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Versioning service</text>
<text x="340" y="242" text-anchor="middle" font-size="12" fill="#085041">Creates new version</text>
</g>

<g>
<rect x="460" y="200" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="545" y="222" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Primary database</text>
<text x="545" y="242" text-anchor="middle" font-size="12" fill="#444441">One transaction</text>
</g>

<g>
<rect x="255" y="290" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="312" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Verification log query</text>
<text x="340" y="332" text-anchor="middle" font-size="12" fill="#085041">Finds affected verifiers</text>
</g>

<g>
<rect x="255" y="380" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="402" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Notification queue writer</text>
<text x="340" y="422" text-anchor="middle" font-size="12" fill="#085041">Queues notify jobs</text>
</g>

<g>
<rect x="255" y="470" width="170" height="44" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="340" y="496" text-anchor="middle" font-size="14" font-weight="500" fill="#26215C">Notification service</text>
</g>
</svg>
