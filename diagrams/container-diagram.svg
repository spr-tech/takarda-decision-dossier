<svg width="680" height="476" viewBox="0 0 680 476" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Takarda container diagram</title>
<desc>Containers inside the Takarda platform: CDN/Edge, Application Server, Notification Service, Primary Database, Read Replicas, Result Generation Batch Job, Reconciliation Job, and the external Payment Partner</desc>
<defs>
<marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<rect x="40" y="60" width="600" height="280" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="60" y="85" font-size="14" font-weight="500" fill="#26215C">Takarda platform</text>

<line x1="340" y1="156" x2="235" y2="180" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow2)"/>
<line x1="340" y1="156" x2="430" y2="180" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow2)"/>
<line x1="145" y1="260" x2="235" y2="236" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow2)"/>
<path d="M145 260 L145 156" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow2)"/>
<path d="M340 260 L340 236 L320 236" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow2)"/>
<line x1="340" y1="316" x2="430" y2="380" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow2)"/>
<line x1="425" y1="128" x2="450" y2="128" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow2)"/>

<g>
<rect x="60" y="100" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="122" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">CDN / Edge</text>
<text x="145" y="142" text-anchor="middle" font-size="12" fill="#085041">Serves cached files</text>
</g>

<g>
<rect x="255" y="100" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="122" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Application server</text>
<text x="340" y="142" text-anchor="middle" font-size="12" fill="#085041">Handles writes</text>
</g>

<g>
<rect x="450" y="100" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="535" y="122" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Notification service</text>
<text x="535" y="142" text-anchor="middle" font-size="12" fill="#085041">Notifies employers</text>
</g>

<g>
<rect x="150" y="180" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="235" y="202" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Primary database</text>
<text x="235" y="222" text-anchor="middle" font-size="12" fill="#444441">Postgres, writes</text>
</g>

<g>
<rect x="345" y="180" width="170" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="430" y="202" text-anchor="middle" font-size="14" font-weight="500" fill="#2C2C2A">Read replicas</text>
<text x="430" y="222" text-anchor="middle" font-size="12" fill="#444441">Verification, search</text>
</g>

<g>
<rect x="60" y="260" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="145" y="282" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Result generation job</text>
<text x="145" y="302" text-anchor="middle" font-size="12" fill="#085041">Runs before noon</text>
</g>

<g>
<rect x="255" y="260" width="170" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="340" y="282" text-anchor="middle" font-size="14" font-weight="500" fill="#04342C">Reconciliation job</text>
<text x="340" y="302" text-anchor="middle" font-size="12" fill="#085041">Detects double charge</text>
</g>

<g>
<rect x="345" y="380" width="170" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="430" y="402" text-anchor="middle" font-size="14" font-weight="500" fill="#4A1B0C">Payment partner</text>
<text x="430" y="422" text-anchor="middle" font-size="12" fill="#712B13">External, no idempotency</text>
</g>
</svg>
