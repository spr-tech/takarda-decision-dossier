<path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>

<line x1="125" y1="96" x2="300" y2="170" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="555" y1="96" x2="390" y2="170" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="240" x2="340" y2="280" stroke="#5F5E5A" stroke-width="1" fill="none" marker-end="url(#arrow)"/>
