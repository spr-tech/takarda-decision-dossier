<svg width="680" height="466" viewBox="0 0 680 466" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Takarda system context diagram</title>
<desc>Takarda platform at the center, connected to Candidate, School, Employer, Council Officer, and Payment Partner</desc>
<defs>
